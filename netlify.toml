# Netlify: host-based redirect when both custom domains are on this site.
# Cloudflare Pages uses root `_redirects` (same rules). Dashboard steps: docs/farowin-go-live.md in Project store.

[[redirects]]
  from = "https://acoyatravels.com/*"
  to = "https://farowintravels.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.acoyatravels.com/*"
  to = "https://farowintravels.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://acoyatravels.com/*"
  to = "https://farowintravels.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.acoyatravels.com/*"
  to = "https://farowintravels.com/:splat"
  status = 301
  force = true
